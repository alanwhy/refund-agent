x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://refund:refund@postgres:5432/refund}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refund
      POSTGRES_USER: refund
      POSTGRES_PASSWORD: refund
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refund -d refund"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: refund-agent-backend:local
    environment:
      <<: *backend-environment
      SERVICE_ROLE: migrate
    command: python -m refund_agent.infrastructure.migrations
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    image: refund-agent-backend:local
    environment:
      <<: *backend-environment
      SERVICE_ROLE: api
    command: uvicorn refund_agent.api.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    image: refund-agent-backend:local
    environment:
      <<: *backend-environment
      SERVICE_ROLE: worker
    command: celery -A refund_agent.worker.celery_app worker --loglevel=INFO
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build: ./backend
    image: refund-agent-backend:local
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://refund:refund@postgres:5432/refund}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      SERVICE_ROLE: scheduler
    command: celery -A refund_agent.worker.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    depends_on:
      - worker

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
