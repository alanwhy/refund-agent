[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-agent"
version = "0.1.0"
description = "Auditable human-in-the-loop refund agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jieba>=0.42,<1",
  "langgraph>=0.2,<1",
  "openai>=1.50,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.5,<3",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "redis>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "structlog>=24,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
